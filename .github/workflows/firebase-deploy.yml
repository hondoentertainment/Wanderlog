name: Deploy Firebase rules

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules, indexes, and Storage rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "Add FIREBASE_TOKEN repository secret (firebase login:ci) to enable this workflow."
            exit 1
          fi
          firebase deploy --only firestore:rules,firestore:indexes,storage --project "${{ secrets.FIREBASE_PROJECT_ID }}" --token "$FIREBASE_TOKEN"
