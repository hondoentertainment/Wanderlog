name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable pnpm
            pnpm install --frozen-lockfile
          else
            npm install
          fi

      - name: Build
        run: npm run build
        env:
          # Required for vite build without repo secrets — real deploys supply VITE_FIREBASE_* from the host env.
          VITE_CI_USE_FIREBASE_PLACEHOLDER: 'true'

      - name: Vitest
        run: npm test

      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          CI: true
          # Playwright `npm run dev` must bootstrap Firebase with a shaped config without repo secrets.
          VITE_CI_USE_FIREBASE_PLACEHOLDER: 'true'
